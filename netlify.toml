[build]
  publish = "."
  command = ""

# ── Keep the backend source off the public web ──────────────────────────────
# Netlify serves everything in the repository, so without this rule anyone
# could open https://your-site.netlify.app/apps-script/Code.gs and read the
# file — including any key left in it. `force = true` is required: without it
# Netlify serves the real file and never reaches this rule.
[[redirects]]
  from = "/apps-script/*"
  to = "/index.html"
  status = 404
  force = true

# Single page — every other path renders the dashboard.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# App code changes often — never let a browser serve a stale build.
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
